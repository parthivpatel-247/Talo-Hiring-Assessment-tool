name = "talo"
main = "src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

# Static frontend (public/) is served through the Worker so every response,
# including HTML, CSS and fonts, carries the security headers.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "campus-hiring-assessment-db"
database_id = "3feef41d-9982-462b-bc79-cf9fcfc14965"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RESUMES"
bucket_name = "campus-hiring-resumes"

# Every 10 minutes: close attempts past their hard deadline.
# Daily 03:00 UTC: data-retention purge, daily backup, housekeeping.
[triggers]
crons = ["*/10 * * * *", "0 3 * * *"]

# Workers Logs (request logs and console output) in the Cloudflare dashboard.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://talo.hevo-talo.workers.dev"
ORG_NAME = "Hevo Data"
OPENAI_MODEL = "gpt-4o-mini"
# First manager account. Pairs with the ADMIN_PASSWORD secret ONLY for first-run
# setup: once a manager account exists, ADMIN_PASSWORD stops working.
ADMIN_EMAIL = "parthiv.patel@hevodata.com"
# Help + legal contact shown to candidates (editable in Settings).
CONTACT_EMAIL = "parthiv.patel@hevodata.com"
# Defaults for a fresh database; the live values are edited in Settings.
PART1_DURATION_MINUTES = "60"
DATA_RETENTION_DAYS = "15"
SQL_QUESTIONS_PER_STUDENT = "2"
PYTHON_QUESTIONS_PER_STUDENT = "1"
DSA_QUESTIONS_PER_STUDENT = "1"
SCENARIO_QUESTIONS_PER_STUDENT = "1"
SQL_MARKS = "3"
PYTHON_MARKS = "4"
DSA_MARKS = "5"
SCENARIO_MARKS = "5"
STALE_GRACE_MINUTES = "2"
GRADING_BATCH_SIZE = "8"
GRADING_CONCURRENCY = "6"
RESUME_PARSE_CONCURRENCY = "8"
# Email (optional): "resend" or "sendgrid". Also set the EMAIL_API_KEY secret.
EMAIL_PROVIDER = ""
EMAIL_FROM = ""
# Cloudflare Turnstile (optional). Also set the TURNSTILE_SECRET secret.
TURNSTILE_SITE_KEY = ""

# Secrets (set with `npx wrangler secret put <NAME>`; never commit them):
#   SESSION_SECRET    long random string: `openssl rand -hex 32`
#   OPENAI_API_KEY    server-side only
#   ADMIN_PASSWORD    first-run setup password (stops working once a manager exists)
#   EMAIL_API_KEY     optional, for Resend or SendGrid
#   TURNSTILE_SECRET  optional, for Cloudflare Turnstile
